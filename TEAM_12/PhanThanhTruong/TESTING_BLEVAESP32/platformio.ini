[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Tốc độ baudrate của Serial Monitor (trùng với Serial.begin trong code)
monitor_speed = 115200

; Khai báo danh sách các thư viện bên ngoài cần tải về
lib_deps = 
	; 1. Thư viện cho Telegram Bot và xử lý JSON
	witnessmenow/UniversalTelegramBot @ ^1.3.0
	bblanchon/ArduinoJson @ ^6.21.3
	
	; 2. Thư viện cho cảm biến nhiệt độ DHT22
	adafruit/DHT sensor library @ ^1.4.4
	adafruit/Adafruit Unified Sensor @ ^1.1.13
	
	; 3. Thư viện cho màn hình OLED SSD1306 (Giao tiếp I2C)
	adafruit/Adafruit SSD1306 @ ^2.5.7
	adafruit/Adafruit GFX Library @ ^1.11.9