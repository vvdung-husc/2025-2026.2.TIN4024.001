[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 74880   

lib_deps =
    # Sử dụng ID số hoặc tên chính xác từ Registry
    blynkkk/Blynk @ ^1.3.2
    # Thư viện Telegram - Cách khai báo an toàn hơn
    UniversalTelegramBot
    # ArduinoJson là bắt buộc cho Telegram Bot
    bblanchon/ArduinoJson @ ^6.21.3
    
    # Các thư viện hỗ trợ phần cứng
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit SH110X @ ^2.1.8
    adafruit/Adafruit GFX Library @ ^1.11.5
    adafruit/Adafruit BusIO @ ^1.14.1