; ============================================================
; File: platformio.ini
; Dự án: Hệ thống cảnh báo trộm ESP32 + PIR + Telegram/Email
; Tác giả: Phạm Thanh Hiếu
; Mô tả: Cấu hình môi trường PlatformIO cho ESP32
; ============================================================

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Tốc độ Serial Monitor
monitor_speed = 115200

; Tốc độ nạp firmware
upload_speed = 921600

; Các thư viện cần thiết
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    witnessmenow/UniversalTelegramBot @ ^1.1.0
    mobizt/ESP Mail Client @ ^3.4.15
build_flags =
    -DCORE_DEBUG_LEVEL=1

; Partition scheme - tăng dung lượng cho app
board_build.partitions = default.csv